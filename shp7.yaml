preferences:
  flash_write_interval: 0s

substitutions:
  device_name: shp7
  current_res: "0.002291"
  version: "1.2"
  voltage_div: "994"

esphome:
  name: ${device_name}
  friendly_name: BlitzWolf SHP7

  on_boot:
    - priority: -100
      then:
        - lambda: |-
            if (id(power_on_mode) == "Outputs ON") {
              id(relay1).turn_on();
              id(relay2).turn_on();
            }
            else if (id(power_on_mode) == "Outputs Previous") {
              if (id(last_relay1)) {
                id(relay1).turn_on();
              } else {
                id(relay1).turn_off();
              }

              if (id(last_relay2)) {
                id(relay2).turn_on();
              } else {
                id(relay2).turn_off();
              }
            }
            else {
              id(relay1).turn_off();
              id(relay2).turn_off();
            }

    - priority: -200
      then:
        - if:
            condition:
              switch.is_on: relay1
            then:
              - script.execute: socket1_timeout_script

        - if:
            condition:
              switch.is_on: relay2
            then:
              - script.execute: socket2_timeout_script
          
esp8266:
  board: esp8285
  restore_from_flash: true

logger:
  baud_rate: 0

api:

ota:
  - platform: esphome
    password: !secret otapw

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

    - ssid: !secret wifi_ssid2
      password: !secret wifi_password

    - ssid: !secret wifi_ssid3
      password: !secret wifi_password

    - ssid: !secret wifi_ssid4
      password: !secret wifi_password

    - ssid: !secret wifi_ssid5
      password: !secret wifi_password

  power_save_mode: none
  post_connect_roaming: true

  ap:
    ssid: "SHP7 Fallback"
    password: !secret appw

captive_portal:

web_server:
  port: 80
  version: 3
  log: false
  css_url: "http://192.168.1.20:8123/local/shp7-style.css"

time:
  - platform: sntp
    id: shp7_time
    timezone: Europe/Madrid

    on_time:
      - seconds: 0
        minutes: "*"
        then:
          - if:
              condition:
                time.has_time:
                  id: shp7_time
              then:
                - lambda: |-
                    auto now = id(shp7_time).now();

                    // Socket 1 fixed ON time
                    if (id(socket1_on_event).current_option() == "Fixed time") {
                      auto t = id(socket1_on_time).state_as_esptime();
                      if ((t.hour != 0 || t.minute != 0) &&
                          now.hour == t.hour &&
                          now.minute == t.minute) {
                        id(relay1).turn_on();
                      }
                    }

                    // Socket 1 fixed OFF time
                    if (id(socket1_off_event).current_option() == "Fixed time") {
                      auto t = id(socket1_off_time).state_as_esptime();
                      if ((t.hour != 0 || t.minute != 0) &&
                          now.hour == t.hour &&
                          now.minute == t.minute) {
                        id(relay1).turn_off();
                      }
                    }

                    // Socket 2 fixed ON time
                    if (id(socket2_on_event).current_option() == "Fixed time") {
                      auto t = id(socket2_on_time).state_as_esptime();
                      if ((t.hour != 0 || t.minute != 0) &&
                          now.hour == t.hour &&
                          now.minute == t.minute) {
                        id(relay2).turn_on();
                      }
                    }

                    // Socket 2 fixed OFF time
                    if (id(socket2_off_event).current_option() == "Fixed time") {
                      auto t = id(socket2_off_time).state_as_esptime();
                      if ((t.hour != 0 || t.minute != 0) &&
                          now.hour == t.hour &&
                          now.minute == t.minute) {
                        id(relay2).turn_off();
                      }
                    }

sun:
  latitude: 37.743
  longitude: -2.551

  on_sunset:
    - then:
        - lambda: |-
            if (id(socket1_on_event).current_option() == "Dusk") {
              id(relay1).turn_on();
            }

            if (id(socket2_on_event).current_option() == "Dusk") {
              id(relay2).turn_on();
            }

  on_sunrise:
    - then:
        - lambda: |-
            if (id(socket1_off_event).current_option() == "Dawn") {
              id(relay1).turn_off();
            }

            if (id(socket2_off_event).current_option() == "Dawn") {
              id(relay2).turn_off();
            }

globals:
  - id: power_on_mode
    type: std::string
    restore_value: yes
    initial_value: '"Outputs OFF"'

  - id: last_relay1
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: last_relay2
    type: bool
    restore_value: yes
    initial_value: "false"

binary_sensor:
  - platform: gpio
    id: button1
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay1

  - platform: gpio
    id: button2
    internal: true
    pin:
      number: GPIO12
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay2

  - platform: gpio
    pin: GPIO15
    id: gpio15_irq
    internal: true

text_sensor:
  - platform: template
    name: "SHP7 Firmware Version"
    icon: mdi:chip
    update_interval: 60s
    web_server:
      sorting_weight: 4
    lambda: |-
      return {"${version}"};

output:
  - platform: esp8266_pwm
    id: led1
    pin:
      number: GPIO13
      inverted: true

  - platform: esp8266_pwm
    id: led2
    pin:
      number: GPIO2
      inverted: true

  - platform: gpio
    pin:
      number: GPIO1
      inverted: true
    id: status_led

button:
  - platform: template
    name: "Reboot"
    icon: "mdi:restart"
    web_server:
      sorting_weight: 50
    on_press:
      - repeat:
          count: 5
          then:
            - output.turn_on: status_led
            - delay: 200ms
            - output.turn_off: status_led
            - delay: 200ms
      - delay: 500ms
      - lambda: |-
          App.safe_reboot();
      
switch:
  - platform: gpio
    pin: GPIO14
    id: relay1
    name: "Socket 1"
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_weight: 7
    on_turn_on:
      - output.turn_on: led1
      - lambda: |-
          id(last_relay1) = true;
      - script.execute: socket1_timeout_script
    on_turn_off:
      - output.turn_off: led1
      - lambda: |-
          id(last_relay1) = false;
      - script.stop: socket1_timeout_script
        
  - platform: gpio
    pin: GPIO16
    id: relay2
    name: "Socket 2"
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_weight: 12
    on_turn_on:
      - output.turn_on: led2
      - lambda: |-
          id(last_relay2) = true;
      - script.execute: socket2_timeout_script
    on_turn_off:
      - output.turn_off: led2
      - lambda: |-
          id(last_relay2) = false;
      - script.stop: socket2_timeout_script



sensor:
  - platform: hlw8012
    sel_pin:
      number: GPIO3
      inverted: true
    cf_pin: GPIO4
    cf1_pin: GPIO5

    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}

    current:
      name: "SHP7 Current"
      unit_of_measurement: A
      accuracy_decimals: 3
      web_server:
        sorting_weight: 2

    voltage:
      name: "SHP7 Voltage"
      unit_of_measurement: V
      accuracy_decimals: 1
      web_server:
        sorting_weight: 6

    power:
      name: "SHP7 Power"
      unit_of_measurement: W
      accuracy_decimals: 1
      id: shp7_power
      web_server:
        sorting_weight: 5

    energy:
      name: "SHP7 Energy"
      unit_of_measurement: Wh
      accuracy_decimals: 2
      web_server:
        sorting_weight: 3

    change_mode_every: 4
    update_interval: 10s

  - platform: wifi_signal
    name: "SHP7 WiFi Signal"
    update_interval: 60s
    accuracy_decimals: 0

  - platform: uptime
    name: "SHP7 Uptime"
    update_interval: 300s

number:
  - platform: template
    name: "Timeout 1"
    id: timeout1
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 1440
    step: 1
    unit_of_measurement: min
    mode: box

  - platform: template
    name: "Timeout 2"
    id: timeout2
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 1440
    step: 1
    unit_of_measurement: min
    mode: box

script:
  - id: socket1_timeout_script
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(timeout1).state > 0;'
          then:
            - delay: !lambda 'return (uint32_t)(id(timeout1).state * 60000);'
            - if:
                condition:
                  switch.is_on: relay1
                then:
                  - switch.turn_off: relay1

  - id: socket2_timeout_script
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(timeout2).state > 0;'
          then:
            - delay: !lambda 'return (uint32_t)(id(timeout2).state * 60000);'
            - if:
                condition:
                  switch.is_on: relay2
                then:
                  - switch.turn_off: relay2    
    
select:
  - platform: template
    name: "Power-on Behaviour"
    id: power_on_behavior
    icon: mdi:power-settings
    optimistic: true
    restore_value: true
    initial_option: "Outputs OFF"
    web_server:
      sorting_weight: 1
    options:
      - "Outputs OFF"
      - "Outputs Previous"
      - "Outputs ON"
    set_action:
      - lambda: |-
          id(power_on_mode) = x;

  # Socket 1 ON Event
  - platform: template
    name: "Socket 1 On Event"
    id: socket1_on_event
    icon: mdi:calendar-clock
    optimistic: true
    restore_value: true
    initial_option: "Fixed time"
    web_server:
      sorting_weight: 8
    options:
      - "Fixed time"
      - "Dusk"

  # Socket 1 OFF Event
  - platform: template
    name: "Socket 1 Off Event"
    id: socket1_off_event
    icon: mdi:calendar-clock
    optimistic: true
    restore_value: true
    initial_option: "Fixed time"
    web_server:
      sorting_weight: 10
    options:
      - "Fixed time"
      - "Dawn"

  # Socket 2 ON Event
  - platform: template
    name: "Socket 2 On Event"
    id: socket2_on_event
    icon: mdi:calendar-clock
    optimistic: true
    restore_value: true
    initial_option: "Fixed time"
    web_server:
      sorting_weight: 13
    options:
      - "Fixed time"
      - "Dusk"

  # Socket 2 OFF Event
  - platform: template
    name: "Socket 2 Off Event"
    id: socket2_off_event
    icon: mdi:calendar-clock
    optimistic: true
    restore_value: true
    initial_option: "Fixed time"
    web_server:
      sorting_weight: 15
    options:
      - "Fixed time"
      - "Dawn"

datetime:
  # Socket 1 ON Time
  - platform: template
    id: socket1_on_time
    name: "Socket 1 On Time"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    icon: mdi:clock-time-four-outline
    web_server:
      sorting_weight: 9

  # Socket 1 OFF Time
  - platform: template
    id: socket1_off_time
    name: "Socket 1 Off Time"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    icon: mdi:clock-time-four-outline
    web_server:
      sorting_weight: 11

  # Socket 2 ON Time
  - platform: template
    id: socket2_on_time
    name: "Socket 2 On Time"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    icon: mdi:clock-time-four-outline
    web_server:
      sorting_weight: 14

  # Socket 2 OFF Time
  - platform: template
    id: socket2_off_time
    name: "Socket 2 Off Time"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    icon: mdi:clock-time-four-outline
    web_server:
      sorting_weight: 16
